      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="svg_mtn_01" x1="0%" y1="0%" x2="100%" y2="100%">
